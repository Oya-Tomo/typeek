[package]
name = "typeek"
version = "0.1.0"
edition = "2024"
description = "Terminal previewer for Typst documents"

[dependencies]
color-eyre = "0.6"
image = { version = "0.25", default-features = false }
ratatui = "0.30"
# 12.0.0-rc fixes SlicedProtocol::Sixel when a page is clipped at both the top and bottom.
ratatui-image = { version = "=12.0.0-rc.2", default-features = false, features = ["crossterm"] }
tiny-skia = "0.12"
typst = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
  "datetime",
  "embedded-fonts",
  "scan-fonts",
  "system-downloader",
  "system-files",
  "vendor-openssl",
  "watcher",
] }
typst-layout = "0.15.1"
typst-render = "0.15.1"

# Typst compilation and image encoding are unbearably slow unoptimized, so optimize
# dependencies even in dev builds while keeping this crate quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
